
name: Predictive Maintenance Pipeline

# Run the complete ML pipeline when project inputs or pipeline code change.
on:
  push:
    branches:
      - main
    paths:
      - "data/**"
      - "model_building/**"
      - "deployment/**"
      - ".github/workflows/**"
      - "requirements.txt"
      - "app.py"
      - "README.md"

  # Allow manual execution from the GitHub Actions tab.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  data-preparation:
    name: Clean Data and Create Train-Test Splits
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Debug workflow and cache settings
        run: |
          echo "Workflow file: $GITHUB_WORKFLOW"
          echo "Branch: $GITHUB_REF"
          echo "Commit: $GITHUB_SHA"

          echo "Searching workflow files for pip caching..."
          grep -n -E 'cache:[[:space:]]*["'\'']?pip|cache-dependency-path' \
            .github/workflows/*.yml .github/workflows/*.yaml || true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas==2.2.2 scikit-learn

